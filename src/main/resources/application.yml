spring:
  application:
    name: authz-poc
  main:
    banner-mode: off
  datasource:
    url: jdbc:postgresql://localhost:5432/authz
    username: authz
    password: authz
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/demo
  data:
    redis:
      host: localhost
      port: 6379
  docker:
    compose:
      lifecycle-management: start-only

management:
  metrics:
    distribution:
      percentiles-histogram:
        authz.check: true

logging:
  level:
    root: WARN
    com.bukcase: INFO

demo:
  console:
    enabled: true

authz:
  version-refresh-ms: 500
  cache:
    namespace: default
