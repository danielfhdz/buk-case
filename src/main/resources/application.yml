spring:
  application:
    name: authz-poc
  datasource:
    url: jdbc:postgresql://localhost:5432/authz
    username: authz
    password: authz
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/demo
  data:
    redis:
      host: localhost
      port: 6379
  docker:
    compose:
      lifecycle-management: start-only

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        authz.check: true

authz:
  version-refresh-ms: 500
  cache:
    namespace: default
